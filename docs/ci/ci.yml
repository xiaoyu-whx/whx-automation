name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: 单元测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "运行环境没有预装 Android SDK" >&2
            exit 1
          fi
          echo "sdk.dir=$SDK_ROOT" > local.properties
          yes 2>/dev/null | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      # assembleRelease 需要仓库外的签名密钥，CI 里只跑 debug 构建 + 全部单测
      - name: 单元测试
        run: ./gradlew :core:test :helper:test :app:testDebugUnitTest --no-daemon --console=plain

      - name: 构建 debug 包
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: 汇总测试结果
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = failed = 0
          for path in glob.glob("*/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              total += int(root.get("tests") or 0)
              failed += int(root.get("failures") or 0) + int(root.get("errors") or 0)
          print(f"单元测试：{total} 个用例，{failed} 个失败")
          sys.exit(1 if failed else 0)
          PY

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '*/build/test-results/**/*.xml'
          if-no-files-found: warn

  tools:
    name: 工具脚本语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 语法与打包器自检
        run: |
          python -m py_compile tools/whx.py tools/vision_cli.py tools/push.sh 2>/dev/null || \
            python -m py_compile tools/whx.py tools/vision_cli.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "packer")
          import make_sprite
          # AXML 编码器自检：解析→重编码必须字节一致（曾经因为 UTF-16 长度前缀踩过坑）
          strings = ["theme", "label", "包名"]
          for flags in (0x100, 0x0000):
              chunk = make_sprite.build_string_pool(strings, flags, 0, 28)
              assert chunk[:2] == b"\x01\x00", "字符串池魔法不对"
          print("AXML 编码器自检通过")
          PY
