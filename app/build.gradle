plugins {
    id 'com.android.application'
}

android {
    namespace 'com.whx.automation'
    compileSdk 34

    defaultConfig {
        applicationId "com.whx.automation"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        // 发布签名：与打包器共用同一密钥，便于小精灵与主包相互覆盖升级。
        // 密钥不进仓库（.gitignore）；生成方式见 docs/release.md
        releaseKey {
            storeFile file(System.getProperty("user.home") + "/.whx/release.jks")
            storePassword = "whxrelease"
            keyAlias = "release"
            keyPassword = "whxrelease"
        }
    }

    buildTypes {
        debug {
            // 阶段一只要跑起来，不做混淆
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.releaseKey
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // helper 的 dex 后面会放进 assets，先不影响打包
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

dependencies {
    implementation project(':core')
    implementation project(':helper')
    // QuickJS：Android 端的 JS 引擎（支持 async/await，约 1MB）
    implementation 'app.cash.quickjs:quickjs-android:0.9.2'
    testImplementation 'junit:junit:4.13.2'
}
